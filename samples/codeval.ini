[SERVER]
url=<CANVAS URL HERE>
token=<CANVAS TOKEN HERE
[RUN]
precommand=
command=docker run -i -v SUBMISSIONS:/submissions -v ~/.m2:/root/.m2 autograder-java bash -c "cd /submissions; EVALUATE"
; mobile_command is used when the codeval file contains an EMULATOR tag.
; The container needs --device /dev/kvm for hardware acceleration and the Android SDK installed.
mobile_command=docker run -i --device /dev/kvm -e ANDROID_HOME=/opt/android-sdk -v SUBMISSIONS:/submissions autograder-android bash -c "cd /submissions; EVALUATE"
; The following lines are needed for distributed assignments autograding:
dist_command=docker run --name NAME -dt -v SUBMISSIONS:/submissions -v ~/.m2:/root/.m2 PORTS autograder-java
host_ip=<your machine IP>
[MONGO]
url=mongodb://localhost:27017/
db=codeval_submissions